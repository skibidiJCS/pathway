<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/pathway-logo.png" />
    <meta
      name="description"
      content="Explore a paper’s citation neighborhood."
    />
    <meta property="og:title" content="Pathway Research" />
    <meta
      property="og:description"
      content="Explore a paper’s citation neighborhood."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://pathwayresearch.vercel.app/" />
    <meta
      property="og:image"
      content="https://pathwayresearch.vercel.app/og.png?v=20260725-2"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pathway Research" />
    <meta
      name="twitter:description"
      content="Explore a paper’s citation neighborhood."
    />
    <meta
      name="twitter:image"
      content="https://pathwayresearch.vercel.app/og.png?v=20260725-2"
    />
    <script>
      try {
        const savedTheme = localStorage.getItem("pathway:theme");
        document.documentElement.dataset.theme =
          savedTheme === "dark" || savedTheme === "light"
            ? savedTheme
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    </script>
    <title>Pathway Research</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
